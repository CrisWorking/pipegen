name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx netlify-cli deploy --dir=out --prod
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
