- id: pipegen-setup-python
  name: Set up Python
  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
  with:
    python-version: "3.11"
- id: tool-install-ed4f8358c8fde1c3
  name: Install mypy (pip, hashes required)
  run: |-
    set -euo pipefail
    unset CDPATH
    pg_fail() { echo "pipegen: $1" >&2; exit 1; }
    py="$(command -v python3 || true)"
    [ -n "$py" ] || pg_fail "python3 was not found; the Python setup step must run first"
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    home="$RUNNER_TEMP/pipegen-home/pipegen-out-type-check"
    mkdir -p "$RUNNER_TEMP/pipegen-home" "$home"
    sys=(
      /usr/bin/env -i
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "HOME=$home"
    )
    venv="$RUNNER_TEMP/pipegen-venv/pipegen-out-type-check"
    mkdir -p "$RUNNER_TEMP/pipegen-pip" "$RUNNER_TEMP/pipegen-venv"
    mkdir "$RUNNER_TEMP/pipegen-pip/pipegen-out-type-check"
    printf '%s' "$PIPEGEN_REQUIREMENTS" > "$RUNNER_TEMP/pipegen-pip/pipegen-out-type-check/requirements.txt"
    pg_env=(
      /usr/bin/env -i
      "HOME=$home"
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "RUNNER_TEMP=$RUNNER_TEMP"
      "TMPDIR=$RUNNER_TEMP"
    )
    cd "$RUNNER_TEMP"
    "${pg_env[@]}" "$py" -I -m venv "$venv"
    "${pg_env[@]}" "$venv/bin/python" -I -m pip install --isolated --no-input --only-binary=:all: --require-hashes --no-deps --no-cache-dir --disable-pip-version-check -r "$RUNNER_TEMP/pipegen-pip/pipegen-out-type-check/requirements.txt"
  shell: bash
  env:
    BASH_ENV: ""
    ENV: ""
    PIPEGEN_REQUIREMENTS: "mypy==2.4.0 --hash=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      typing-extensions==4.12.2 --hash=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n"
- id: repocode-ed4f8358c8fde1c3
  name: Run mypy
  run: |-
    set -euo pipefail
    unset CDPATH
    pg_fail() { echo "pipegen: $1" >&2; exit 1; }
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    home="$RUNNER_TEMP/pipegen-home/pipegen-out-type-check"
    mkdir -p "$RUNNER_TEMP/pipegen-home" "$home"
    sys=(
      /usr/bin/env -i
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "HOME=$home"
    )
    venv="$RUNNER_TEMP/pipegen-venv/pipegen-out-type-check"
    pg_env=(
      /usr/bin/env -i
      "HOME=$home"
      "PATH=$venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "RUNNER_TEMP=$RUNNER_TEMP"
      "TMPDIR=$RUNNER_TEMP"
    )
    rc=0
    "${pg_env[@]}" "$venv/bin/mypy" --no-incremental . || rc=$?
    exit "$rc"
  shell: bash
  env:
    BASH_ENV: ""
    ENV: ""
