- name: Check out the repository
  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  with:
    persist-credentials: "false"
    allow-unsafe-pr-checkout: "false"
    fetch-depth: "0"
- name: Set up Node.js
  uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  with:
    package-manager-cache: "false"
    node-version: "22"
- name: Review the dependencies
  uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  with:
    comment-summary-in-pr: never
- name: Upload the result to code scanning
  uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
  with:
    sarif_file: "${{ runner.temp }}/pipegen-out/pipegen-out-sast--api/results.sarif"
    category: pipegen-sast
- name: Upload the result
  if: always()
  uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
  with:
    include-hidden-files: "false"
    if-no-files-found: error
    archive: "true"
    name: pipegen-out-sast--api
    path: "${{ runner.temp }}/pipegen-out/pipegen-out-sast--api/results.sarif"
