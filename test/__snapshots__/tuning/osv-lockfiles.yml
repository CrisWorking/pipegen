- id: tool-install-e22e2f9068c96147
  name: "pipegen: install osv-scanner"
  run: |-
    set -euo pipefail
    unset CDPATH
    pg_fail() { echo "pipegen: $1" >&2; exit 1; }
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    home="$RUNNER_TEMP/pipegen-home/pipegen-out-deps"
    mkdir -p "$RUNNER_TEMP/pipegen-home" "$home"
    sys=(
      /usr/bin/env -i
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "HOME=$home"
    )
    bin="$RUNNER_TEMP/pipegen-bin/pipegen-out-deps"
    dl="$RUNNER_TEMP/pipegen-dl/pipegen-out-deps"
    mkdir -p "$RUNNER_TEMP/pipegen-bin" "$RUNNER_TEMP/pipegen-dl"
    mkdir "$bin" "$dl"
    "${sys[@]}" curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 5 --retry 3 --output "$dl/asset" "$PIPEGEN_DL_URL"
    cd "$dl"
    printf '%s  asset\n' "$PIPEGEN_DL_SHA256" | "${sys[@]}" sha256sum --check --strict -
    mv -- "$dl/asset" "$bin/osv-scanner"
    if [ ! -f "$bin/osv-scanner" ] || [ -L "$bin/osv-scanner" ]; then pg_fail "the tool is not a regular file"; fi
    chmod 0755 "$bin/osv-scanner"
  shell: bash
  env:
    BASH_ENV: ""
    ENV: ""
    PIPEGEN_DL_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
    PIPEGEN_DL_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
- id: tool-run-e22e2f9068c96147
  name: "pipegen: run osv-scanner"
  run: |-
    set -euo pipefail
    unset CDPATH
    pg_fail() { echo "pipegen: $1" >&2; exit 1; }
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    home="$RUNNER_TEMP/pipegen-home/pipegen-out-deps"
    mkdir -p "$RUNNER_TEMP/pipegen-home" "$home"
    sys=(
      /usr/bin/env -i
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "HOME=$home"
    )
    # tuning: also scans the lockfiles apps/web/pnpm-lock.yaml, services/api/package-lock.json (adds coverage)
    bin="$RUNNER_TEMP/pipegen-bin/pipegen-out-deps"
    mkdir -p "$RUNNER_TEMP/pipegen-cfg"
    cfg="$RUNNER_TEMP/pipegen-cfg/pipegen-out-deps"
    mkdir "$cfg"
    printf '%s' "$PIPEGEN_CONFIG" > "$cfg/osv-scanner.toml"
    out=osv.sarif
    outdir=.
    if [ -e "$out" ] || [ -L "$out" ]; then pg_fail "the result file $out exists before the tool ran, so pipegen will not use it"; fi
    [ -d "$outdir" ] && [ ! -L "$outdir" ] || pg_fail "the folder for the result is not a real folder"
    pg_env=(
      /usr/bin/env -i
      "HOME=$home"
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      "RUNNER_TEMP=$RUNNER_TEMP"
      "TMPDIR=$RUNNER_TEMP"
      "PIPEGEN_ARG_0=$PIPEGEN_ARG_0"
      "PIPEGEN_ARG_1=$PIPEGEN_ARG_1"
    )
    rc=0
    "${pg_env[@]}" "$bin/osv-scanner" scan source --lockfile "$PIPEGEN_ARG_0" --lockfile "$PIPEGEN_ARG_1" --config "$cfg/osv-scanner.toml" --recursive --format sarif --output osv.sarif . || rc=$?
    if [ -f "$out" ] && [ ! -L "$out" ]; then
      mkdir -p "$RUNNER_TEMP/pipegen-out"
      mkdir "$RUNNER_TEMP/pipegen-out/pipegen-out-deps"
      dest="$RUNNER_TEMP/pipegen-out/pipegen-out-deps/osv.sarif"
      mv -- "$out" "$dest"
      [ -f "$dest" ] && [ ! -L "$dest" ] || { rm -f -- "$dest"; rc=1; }
      chmod -R a-w "$RUNNER_TEMP/pipegen-out/pipegen-out-deps"
    else
      echo "pipegen: the tool left no regular result file at $out" >&2
      if [ "$rc" -eq 0 ]; then rc=1; fi
    fi
    exit "$rc"
  shell: bash
  env:
    BASH_ENV: ""
    ENV: ""
    PIPEGEN_ARG_0: apps/web/pnpm-lock.yaml
    PIPEGEN_ARG_1: services/api/package-lock.json
    PIPEGEN_CONFIG: "# pipegen's pinned osv-scanner config: no ignored vulnerabilities\n"
