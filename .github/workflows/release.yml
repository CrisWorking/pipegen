name: release

# A release is a pushed `v*` tag, and nothing else. DECISIONS #83: no tag is pushed, and nothing is published, before v0.4.
# Guards (preflight rulings B1, S1, S2, S10, S13):
#   - every job runs only when this is the real repo AND it is public (`github.event.repository.visibility == 'public'`), so a
#     `v*` tag pushed in the private repo (or in a fork) starts nothing;
#   - the tag must point at a commit on main, and that commit must have a green `ci` run (S13);
#   - build once, pack once, test that exact .tgz, then publish that .tgz and nothing rebuilt (S1);
#   - the publish job is the only one with the npm credential path (`id-token: write`, an OIDC token for trusted
#     publishing; there is no npm token anywhere) and it runs in the `npm-release` environment (tags only);
#   - the GitHub release is created as a draft, gets every asset, and is published last, because immutable releases
#     lock their assets at publish (S2).
# Steps for the owner (trusted publisher on npmjs.com, environment, rulesets, signed tags): docs/release.md.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Exact Node for every release job (S10): 26.12.0 ships npm 11.20.0 (trusted publishing needs npm >= 11.5.1).
  RELEASE_NODE: 26.12.0

jobs:
  verify:
    name: verify, build and pack
    if: github.repository == 'CrisWorking/pipegen' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # only to ask whether the ci run of this commit is green
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag history: the previous release is the cooldown's base, main must contain the tag
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.RELEASE_NODE }}
          package-manager-cache: false # a release never restores a cache
      - name: Tag must be a plain version tag on a commit of main
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = tag ] || { echo "::error::not a tag"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' || { echo "::error::tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: The tag must be an annotated tag signed by a key in .github/release-signers (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # read the tag ref once and keep the answer; everything below uses these two values
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')
          type=${ref%%$'\t'*}
          sha=${ref##*$'\t'}
          [ "$type" = tag ] || { echo "::error::$TAG is a lightweight tag; a signed annotated tag (git tag -s) is required"; exit 1; }
          # the annotated tag must point at a commit, and at the commit this run was started for
          obj=$(gh api "repos/$REPO/git/tags/$sha" --jq '[.object.type, .object.sha] | @tsv')
          [ "${obj%%$'\t'*}" = commit ] || { echo "::error::tag $TAG does not point at a commit"; exit 1; }
          [ "${obj##*$'\t'}" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG points at a different commit than this run"; exit 1; }
          # the local tag object must be the one just read, so what is verified below is what was checked above
          [ "$(git rev-parse "refs/tags/$TAG")" = "$sha" ] || { echo "::error::the checked-out tag object differs from the tag ref"; exit 1; }
          # the signer is pinned: only a key listed in the committed allowed-signers file counts (a comment-only file fails closed)
          grep -Evq '^[[:space:]]*(#|$)' .github/release-signers || { echo "::error::.github/release-signers lists no key (docs/release.md C1)"; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-signers verify-tag "$TAG"
      - name: The tagged commit must have a green ci run (the live-network tests are not re-run here)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          [ "$n" -ge 1 ] || { echo "::error::no successful ci run for $GITHUB_SHA"; exit 1; }
      - name: Assert Node and npm versions (trusted publishing needs npm >= 11.5.1)
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          [ "$(node --version)" = "v$RELEASE_NODE" ] || { echo "::error::unexpected node version"; exit 1; }
          printf '%s\n11.5.1\n' "$(npm --version)" | sort -V -C -r || { echo "::error::npm is older than 11.5.1"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Release check (no PENDING reviews, no dependencies, fresh notices, version = tag, cooldown, fresh data, secret-scanner live tests)
        run: node scripts/release-check.ts --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack once (scripts skipped, so the bundle just built and checked is the one packed)
        id: pack
        run: |
          set -euo pipefail
          mkdir out
          npm pack --ignore-scripts --pack-destination out
          shopt -s nullglob
          tgzs=(out/*.tgz)
          [ "${#tgzs[@]}" = 1 ] || { echo "::error::expected exactly one tarball"; exit 1; }
          tgz=${tgzs[0]}
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # CycloneDX SBOM of exactly the bundled packages (the same list as THIRD_PARTY_NOTICES, from the build metafile);
          # devDependencies that are not bundled (vitest, typescript, tsup...) are not listed
          node scripts/notices.ts --sbom-only out/pipegen-sbom.cdx.json
          (cd out && sha256sum "$(basename "$tgz")" pipegen-sbom.cdx.json > SHA256SUMS)
      - name: Test the tarball that will ship
        run: |
          set -euo pipefail
          mkdir unpacked
          tar -xzf out/*.tgz -C unpacked
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("unpacked/package/package.json", "utf8"));
            if (p.dependencies && Object.keys(p.dependencies).length > 0) { console.error("packed package.json has dependencies"); process.exit(1); }
            if (p.version !== process.env.EXPECTED) { console.error("packed version differs from package.json"); process.exit(1); }
            for (const f of ["dist/cli/main.js", "THIRD_PARTY_NOTICES", "data/reviewed-tools.yml"]) {
              if (!fs.existsSync("unpacked/package/" + f)) { console.error("missing in tarball: " + f); process.exit(1); }
            }
            if (fs.readFileSync("unpacked/package/THIRD_PARTY_NOTICES", "utf8") !== fs.readFileSync("THIRD_PARTY_NOTICES", "utf8")) { console.error("tarball notices differ from the committed file"); process.exit(1); }
          '
          node unpacked/package/dist/cli/main.js --version
          # Release mode reads the packed data/reviewed-tools.yml. While entries are PENDING the audit must refuse the
          # list with this exact warning (no network: fetch is stubbed). After the owner's review this assertion changes.
          cat > "$RUNNER_TEMP/stub-fetch.mjs" <<'EOF'
          const repo = { private: false, default_branch: 'main', full_name: 'example/fixture', owner: { type: 'User' } };
          globalThis.fetch = async (input) => {
            const u = new URL(typeof input === 'string' ? input : (input.url ?? String(input)));
            const ok = u.pathname === '/repos/example/fixture';
            return new Response(JSON.stringify(ok ? repo : { message: 'Not Found' }), { status: ok ? 200 : 404, headers: { 'content-type': 'application/json' } });
          };
          EOF
          fx="$RUNNER_TEMP/fixture"
          mkdir -p "$fx/.github/workflows"
          git -C "$fx" init -q
          git -C "$fx" remote add origin https://github.com/example/fixture.git
          printf 'on: push\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n' > "$fx/.github/workflows/a.yml"
          node --import "$RUNNER_TEMP/stub-fetch.mjs" unpacked/package/dist/cli/main.js audit --json --dir "$fx" > "$RUNNER_TEMP/audit.json"
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/audit.json", "utf8"));
            const w = (j.warnings || []).map((x) => x.text).join("\n");
            if (!/^pipegen.s reviewed tool list isn.t usable in this build: [0-9]+ entries still wait for human review/m.test(w)) { console.error("expected the PENDING refusal of the reviewed tool list, got: " + w); process.exit(1); }
          '
        env:
          EXPECTED: ${{ steps.pack.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: build provenance attestation
    needs: verify
    if: github.repository == 'CrisWorking/pipegen' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # signs the attestation with the workflow's OIDC identity
      attestations: write # stores the attestation with the repository (actions/attest-build-provenance)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Check the files against SHA256SUMS
        run: cd out && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.tgz
            out/pipegen-sbom.cdx.json

  publish:
    name: npm publish (trusted publishing, provenance)
    needs: [verify, attest]
    if: github.repository == 'CrisWorking/pipegen' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment only allows `v*` tags (docs/release.md). The npm trusted publisher is bound to this workflow file
    # AND this environment, so a run from a branch or another workflow cannot publish.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential; no npm token exists
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.RELEASE_NODE }}
          package-manager-cache: false # a release never restores a cache
          # no registry-url: that would write an .npmrc that expects NODE_AUTH_TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Check the files against SHA256SUMS, and refuse to run with any npm token present
        run: |
          set -euo pipefail
          (cd out && sha256sum -c SHA256SUMS)
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then echo "::error::an npm token is set; this job publishes with trusted publishing only"; exit 1; fi
          printf '%s\n11.5.1\n' "$(npm --version)" | sort -V -C -r || { echo "::error::npm is older than 11.5.1"; exit 1; }
      - name: Publish the tarball that was tested and attested (provenance is generated from the OIDC identity)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # a pre-release (1.0.0-rc.1) must never become `latest`
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish ./out/*.tgz --provenance --access public --tag "$tag" --registry=https://registry.npmjs.org

  github-release:
    name: GitHub release (draft, assets, then publish)
    needs: [verify, attest, publish]
    if: github.repository == 'CrisWorking/pipegen' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create and publish the release; this is the only job that can
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Create the draft, upload every asset, then publish (immutable releases lock assets at publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" --notes "Release $TAG. Verify it with npm audit signatures and gh attestation verify (docs/release.md)." out/*
          gh release edit "$TAG" --repo "$REPO" --draft=false
