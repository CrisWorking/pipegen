# https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/v1.9.0 --certificate-oidc-issuer
# https://token.actions.githubusercontent.com checksums.txt`: Verified OK; @refs/tags/v1.8.0 fails). Immutable release.
# Each archive holds LICENSE, README.md and the one `betterleaks` binary hashed below.
