# Tool binaries pipegen downloads and runs on the user's machine (Plan B Task 7, ruling B3), read by
# loadPinnedBinaries (src/engine/linters.ts). This file is a trust root, like reviewed-tools.yml: every value
# needs human review before release (ruling S26), and a tool also listed in reviewed-tools.yml must have the same
# version and hash there (ruling S25, checkPinnedAgainstReviewed).
#
# Per platform:
#   url            the GitHub release asset (https://github.com/<repo>/releases/download/v<version>/<asset>)
#   archive        tar.gz, or none for an asset that is the binary itself (cosign)
#   archiveSize    the asset's size in bytes (the download is refused past it)
#   archiveSha256  the asset's sha256, as listed in the release's own checksums file
#   binarySize     the size of the binary (`member`) inside the archive
#   binarySha256   the sha256 of that binary, computed once from the verified archive; re-checked before every use
# For archive: none, the two hashes and the two sizes are the same.
#
# Per tool, as in reviewed-tools.yml (ruling S21, final review I2):
#   pinnedOn       when the entry was pinned; releasedAt must be at least 7 days before it (ruling S26)
#   reviewedBy     PENDING until the owner has reviewed the entry, then the reviewer's name
#   reviewedAt     PENDING, then the review date (YYYY-MM-DD, not before pinnedOn)
# A release build refuses this file while any entry is PENDING; dev and test builds load it.
#
# Pinned on 2026-10-26. Each release was published at least 7 days earlier (cosign 3.1.4, released 2026-10-20,
# was too new, so 3.1.3 is pinned). Sources: the GitHub releases API (assets, sizes, dates) and each release's
# checksums file; binary hashes from the downloaded archives after their archive hash matched.
# betterleaks was added on 2026-10-28 (Plan P Task 7) the same way, see its entry.

# The required local secret scan before `audit --ai` sends code to an AI (Plan P Task 7); gitleaks below is the
# fallback (PIPEGEN_SECRET_SCANNER=gitleaks). The same release as reviewed-tools.yml's betterleaks entry (ruling S25).
# Re-checked 2026-10-28T00:57Z: each archive was downloaded and its sha256 equals both the release's checksums.txt and
