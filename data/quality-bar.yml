# pipegen's quality bar (Plan B Task 3): a tool pipegen doesn't already review is only suggested when it passes
# every rule below. Loaded by loadQualityBar (src/engine/quality-bar.ts); every field is required.
minStars: 500                # fewer stars only pass with a strong OpenSSF Scorecard score
minScorecard: 5              # OpenSSF Scorecard score out of 10; a project Scorecard hasn't scored skips this rule
strongScorecard: 7           # this score or higher makes up for few stars
maxMonthsSinceRelease: 12    # the last release must be newer than this
