# pipegen's reviewed tool list (Plan B Task 8), read by loadReviewed (src/engine/reviewed.ts). This file is a trust
# root: only the tools listed here ever run in a user's CI. Each entry is one exact tool, version, pin and step
# template. Code owners must review every change (Plan R's CODEOWNERS covers data/).
#
# Every value was pinned live on 2026-10-26 with resolvePin (src/engine/pin.ts), read-only (most at 23:11:58Z;
# Bullfrog and the zizmor re-check at 2026-10-26T23:39:15Z): actions by the commit SHA of their tag (from the upstream repo's
# own refs), release binaries by the linux amd64 asset's sha256 (from the release's own checksums file, unless an
# entry says checksumSource: github-asset-digest or computed), images by the digest of their
# multi-platform index. Every release was published at least 7 days before that (ruling S26); releasedAt is the
# server-recorded date. A tool also in data/pinned-binaries.yml has the same version and hash there (ruling S25).
#
# reviewedBy is PENDING until the owner has reviewed the entry (repo, version, pin, fixedInputs, choices,
# configFiles) and sets reviewedBy and reviewedAt in a PR. A release build refuses this list while any entry is
# PENDING (ruling S21).
#
# Entry fields: categories (need categories, plus platform, egress, workflow-lint); languages; candidate (the exact
# pin); step (the template: step.action for actions, step.cli for binaries and images); fixedInputs (set by the
# template, the AI can never change them; config is pipegen's own pinned config, so repo config files are never
# picked up silently); choices (the only inputs the AI may set, each limited to these values); configFiles (files
# the tool would load from a repo by itself; added to the protected paths); proofs (passed Plan E runs).

