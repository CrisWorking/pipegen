# pipegen's reviewed tool list (Plan B Task 8), read by loadReviewed (src/engine/reviewed.ts). This file is a trust
# root: only the tools listed here ever run in a user's CI. Each entry is one exact tool, version, pin and step
# template. Code owners must review every change (Plan R's CODEOWNERS covers data/).
#
# Every value was pinned live with resolvePin (src/engine/pin.ts), read-only: the Plan B entries on 2026-10-26 (most at
# 23:11:58Z; Bullfrog and the zizmor re-check at 23:39:15Z), the Plan P Task 6 entries (from "Plan P Task 6" below) on
# pin day (resolvePin and the downloads at 2026-10-27T23:00-23:20Z; the signature checks again at
# 2026-10-28T00:00:14-26Z, so every verifiedOn is pinnedOn's day): actions by the commit SHA of their tag (from the
# upstream repo's own refs), release binaries by the linux amd64 asset's sha256 (from the release's own checksums file, unless an
# entry says checksumSource: github-asset-digest or computed), npm packages by their sha512 integrity, pip packages by
# the sha256 of their py3-none-any wheel (ruling S20), images by the digest of their multi-platform index. On pin day
# each binary, npm tarball and wheel was also downloaded and hashed, and matched. Every release was published at
# least 7 days before that (ruling S26); releasedAt is the server-recorded date. A tool also in data/pinned-binaries.yml has the same version and hash there (ruling S25).
#
# reviewedBy is PENDING until the owner has reviewed the entry (repo, version, pin, fixedInputs, choices,
# configFiles) and sets reviewedBy and reviewedAt in a PR. A release build refuses this list while any entry is
# PENDING (ruling S21).
#
# Entry fields: categories (need categories, plus platform); languages; candidate (the exact
# pin); step (the template: step.action for actions, step.cli for binaries and images; step.cli.plugins for npm or
# pip packages installed next to the tool, exact and hashed); verifiedWith (the signature or attestation check made
# when pinning: method, the signed asset, the exact certificate identity and issuer, the day; required for the
# MUST_VERIFY repos in src/engine/reviewed.ts); fixedInputs (set by the
# template, the AI can never change them; config is pipegen's own pinned config, so repo config files are never
# picked up silently); choices (the only inputs the AI may set, each limited to these values); configFiles (files
# the tool would load from a repo by itself, protected at ANY depth ('nested'); rootConfigFiles: the same, but protected only at the
# repository root and the service roots; each entry says which and why in a '# Config scope' comment, and when unsure it is
# nested); configSections (`<file>:<section>` of shared
# files the tool reads, e.g. pyproject.toml:tool.mypy; ruling P23); wrappedImage (the image an action's action.yml runs,
# with the digest it resolved to when pinned; ruling P26); step.cli.then (follow-up commands of the same tool; a
# `{choice}` word is the AI's choice, named after the flag it fills, ruling P24); proofs (passed Plan E runs). Every
# entry with a step.cli (cli or image) must match its allowlist in src/engine/tool-flags.ts (ARGV_POLICIES, by id: its
# install method and package, executable, flags, pinned config and env; rulings P19, P28), and every action its input
# policy (ACTION_POLICIES, by exact owner/repo; ruling P29): change the data and the policy together.
#
# Not here, on purpose: KICS was never on this list (its action tags and images were hijacked; the loader refuses it,
# Plan P Task 5). Dependabot (the update-config file) and npm trusted publishing are pipegen's own built-in steps,
# not reviewed entries (Plan P Task 8); so are the repo's own tsc and Jest at their lockfile version (DECISIONS #95).

