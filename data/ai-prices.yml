# AI prices for pipegen's estimates (Plan A Task 9), in USD per million tokens, input and output priced separately.
# Loaded by loadAiPrices (src/estimate/estimate.ts) with a strict schema; every field is required.
# An unknown model is estimated at the price of the most expensive model of the same provider (any provider, if the provider is unknown), and the basis says so.
# That rule is for showing an estimate only: `audit --ai` keeps a hard cost limit, so it refuses a model that has no price here (ruling U14).
# `long`: a price tier. A request whose prompt (all input tokens, cache reads and writes included) is above `above_input_tokens`
# pays these prices for the whole request. Cache prices follow the input price with the same multipliers as the base tier.
checkedAt: '2026-10-27'
providers:
  claude:
    # Anthropic first-party API rates, from the claude-api skill's model table (cached 2026-10-06), read 2026-10-27, and
    # checked against https://platform.claude.com/docs/en/about-claude/pricing.md on 2026-10-27 (same numbers).
    # claude-haiku-5-5: $0.10 / $0.50 for prompts up to 100,000 tokens, $0.50 / $2.50 above (pricing page, "Long context
    # pricing"; skill shared/models.md). Claude 4.6 and later models other than Haiku 5.5 have no long-context tier.
    # claude-mythos-5-1 / claude-mythos-5: $10 / $50 (pricing page); they are priced so they can be chosen directly and so the refusal-fallback charge can use them (the actual fallback
    # targets are claude-opus-5 and claude-opus-4-8).
    source: 'https://platform.claude.com/docs/en/about-claude/pricing.md (read 2026-10-27); claude-api skill model table (cached 2026-10-06)'
    local: false
    models:
      claude-opus-5-5: { input: 4.00, output: 20.00 }
      claude-fable-5-1: { input: 10.00, output: 50.00 }
      claude-fable-5: { input: 10.00, output: 50.00 }
      claude-mythos-5-1: { input: 10.00, output: 50.00 }
      claude-mythos-5: { input: 10.00, output: 50.00 }
      claude-opus-5: { input: 5.00, output: 25.00 }
      claude-opus-4-8: { input: 5.00, output: 25.00 }
      claude-opus-4-7: { input: 5.00, output: 25.00 }
      claude-opus-4-6: { input: 5.00, output: 25.00 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00 }
      claude-sonnet-5: { input: 2.00, output: 10.00 }
      claude-sonnet-4-6: { input: 3.00, output: 15.00 }
      claude-haiku-5-5: { input: 0.10, output: 0.50, long: { above_input_tokens: 100000, input: 0.50, output: 2.50 } }
      claude-haiku-4-5: { input: 1.00, output: 5.00 }
  openai:
    # OpenAI support is experimental. Only models with a price on OpenAI's own pricing page, Standard tier.
    # gpt-5.5: $5 / $30 below 272K prompt tokens, $10 / $45 above (the page's long-context columns, read 2026-10-27).
    # Pro models (gpt-5-pro $15 / $120 and later) are not listed, so audit --ai refuses them.
    source: 'https://developers.openai.com/api/docs/pricing (read 2026-10-27)'
    local: false
    models:
      gpt-5: { input: 1.25, output: 10.00 }
      gpt-5-mini: { input: 0.25, output: 2.00 }
      gpt-5.5: { input: 5.00, output: 30.00, long: { above_input_tokens: 272000, input: 10.00, output: 45.00 } }
  ollama:
    # Ollama runs on the user's own machine: no per-token price.
    source: 'local model, no per-token price'
    local: true
    models: {}
    anyModel: { input: 0, output: 0 }
