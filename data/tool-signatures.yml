# Tool signatures (Plan U Task 1), read by loadToolSignatures (src/audit/coverage.ts). The audit uses them to
# recognise checks a repo's existing workflows and git hooks already run. Nothing here is ever run or installed:
# it only names what to look for.
#
# Entry fields:
#   id            pipegen's label for the tool (lowercase letters, digits, dashes); shown as "by" in the audit.
#   categories    the need categories (src/types.ts NEED_CATEGORIES) a run of this tool counts for.
#   actions       GitHub Actions, as owner/name or owner/name/sub-path. A `uses:` value matches only that exact path
#                 (case-insensitive, @ref ignored), so snyk/actions/setup or anchore/sbom-action/download-syft, which
#                 only install, never count. A last part ending in * is a prefix (snyk/actions/python* matches
#                 snyk/actions/python-3.10).
#   commands      command names, matched only where a command starts (start, after ; && || | $( ( { a newline, a
#                 shell keyword or a wrapper such as npx, sudo, env, uv run, python -m; a path's basename; the image
#                 after docker run), never inside quotes. Words are separated by one space ("npm audit"); a first word
#                 with a slash is a path (.husky/pre-commit). A call with --version or --help (or only -v, -V or -h)
#                 is never a run.
#   excludes      longer commands that start like one of `commands` but are not this check (gitleaks version).
#   commandFails  default (fails on findings), flag (only with one of failFlags), never (only reports).
#   failFlags     flags that make a `flag` command fail on findings.
#   softFlags     flags that stop a command from failing ("--exit-code=0" also matches "--exit-code 0"). They are
#                 also read inside an action's args, cmd_options and options inputs.
#   actionFails   default, input (only with one of failInputs) or never, for the actions.
#   failInputs    `with:` inputs (name: lowercase values, * = any non-empty value) that make an `input` action fail.
#   softInputs    `with:` inputs (name: lowercase values, * = any non-empty value) that stop the action from failing.
#   softUnless    `with:` inputs set (non-empty) to anything except these values stop the action from failing.
#                 Input names are compared case-insensitively, as GitHub does.
#   partialWhy    pipegen's own sentence for a check that never fails the job.
#   onlyWithFlags a command counts only when one of these words is given exactly (npm publish --provenance).
#   notWithFlags  a command doesn't count when one of these flags is given (matched like softFlags).
#   skipInputs    `with:` inputs set to one of these values (* = any non-empty; an expression counts too) mean the
#                 action doesn't do this check at all (pypi-publish with a password makes no attestation).
#   skipUnless    `with:` inputs set (non-empty) to anything but these values (or an expression) mean the same.
#   precommitHooks pre-commit hooks that run this tool: `repo` is the hook repo's exact URL, `ids` its hook ids (from
#                 the repo's .pre-commit-hooks.yaml). A hook of another repo with the same id doesn't count.
# Every entry has actions, commands or both. Where an entry sets commandFails, actionFails, failFlags, softFlags,
# failInputs, softInputs or softUnless, that behaviour was checked on 2026-10-27 against the source or docs named in
# the comment above it (fetched with curl). An entry with no such comment uses the plain default (a run fails on
# findings), which pipegen has not checked tool by tool.
tools:
  # ---------- secrets ----------
  # https://github.com/gitleaks/gitleaks/blob/master/README.md ("--exit-code int ... (default 1)")
  # hooks: https://github.com/gitleaks/gitleaks/blob/master/.pre-commit-hooks.yaml (gitleaks, gitleaks-docker,
  # gitleaks-system: `gitleaks git --pre-commit --redact --staged --verbose`)
  - id: gitleaks
    categories: [secrets]
    actions: [gitleaks/gitleaks-action]
    precommitHooks:
      - repo: https://github.com/gitleaks/gitleaks
        ids: [gitleaks, gitleaks-docker, gitleaks-system]
    commands: [gitleaks]
    excludes: [gitleaks version, gitleaks help, gitleaks completion]
    softFlags: [--exit-code=0]
  # CLI: https://github.com/trufflesecurity/trufflehog/blob/main/README.md ("183 ... only returned if --fail is used")
  # Action: https://github.com/trufflesecurity/trufflehog/blob/main/action.yml (always passes --fail)
  - id: trufflehog
    categories: [secrets]
    actions: [trufflesecurity/trufflehog]
    commands: [trufflehog]
    commandFails: flag
    failFlags: [--fail]
  # https://github.com/Yelp/detect-secrets/blob/master/README.md ("detect-secrets scan" builds a baseline;
  # "detect-secrets-hook" alerts on new secrets)
  # hook: https://github.com/Yelp/detect-secrets/blob/master/.pre-commit-hooks.yaml (id detect-secrets, entry detect-secrets-hook)
  - id: detect-secrets
    categories: [secrets]
    commands: [detect-secrets-hook]
    precommitHooks:
      - repo: https://github.com/Yelp/detect-secrets
        ids: [detect-secrets]
  - id: detect-secrets-scan
    categories: [secrets]
    commands: [detect-secrets scan]
    commandFails: never
    partialWhy: The detect-secrets scan command only writes a baseline file; it doesn't fail when it finds a secret.
  # ---------- code scanning (SAST) ----------
  # semgrep ci: https://semgrep.dev/docs/semgrep-ci/configuring-blocking-and-errors-in-ci ("blocking findings ... exit code 1")
  # semgrep-action is the deprecated wrapper around semgrep ci: https://github.com/returntocorp/semgrep-action
  - id: semgrep
    categories: [sast]
    actions: [semgrep/semgrep-action, returntocorp/semgrep-action]
    commands: [semgrep ci]
  # semgrep scan / semgrep --config: https://github.com/semgrep/semgrep/blob/develop/cli/src/semgrep/commands/scan.py
  # (--error/--no-error, off by default: findings exit 0)
  - id: semgrep-scan
    categories: [sast]
    commands: [semgrep]
    excludes: [semgrep ci, semgrep login, semgrep logout, semgrep install-semgrep-pro, semgrep publish, semgrep lsp, semgrep mcp]
    commandFails: flag
    failFlags: [--error]
    softFlags: [--no-error]
  # Ruling U5: CodeQL uploads results; it blocks only through code scanning merge protection
  # (https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/set-code-scanning-merge-protection)
  - id: codeql
    categories: [sast]
    actions: [github/codeql-action/analyze]
    commands: [codeql database analyze]
    commandFails: never
    actionFails: never
    partialWhy: CodeQL reports findings but does not fail the job; they block only if code scanning merge protection is on.
  # CLI: https://github.com/PyCQA/bandit/blob/main/bandit/cli/main.py (--exit-zero)
  # Action: https://github.com/PyCQA/bandit-action/blob/main/action.yml (runs bandit ... -f sarif -o results.sarif || true)
  - id: bandit
    categories: [sast]
    actions: [PyCQA/bandit-action]
    commands: [bandit]
    softFlags: [--exit-zero]
    actionFails: never
    partialWhy: The official bandit action ignores bandit's exit code, so it never fails the job.
  # https://github.com/securego/gosec/blob/master/README.md ("Use -no-fail to always return 0"); Go's flag package
  # also takes --no-fail. The action passes its `args` input straight to gosec
  # (https://github.com/securego/gosec/blob/master/action.yml), so -no-fail there counts too.
  - id: gosec
    categories: [sast]
    actions: [securego/gosec]
    commands: [gosec]
    softFlags: [-no-fail, --no-fail]
  # ---------- dependencies ----------
  # https://github.com/snyk/actions/blob/master/action.yml (input command, default test); only the scanning
  # sub-actions are listed, never snyk/actions/setup (install only)
  - id: snyk
    categories: [deps]
    actions:
      - snyk/actions
      - snyk/actions/node
      - snyk/actions/python*
      - snyk/actions/golang
      - snyk/actions/ruby
      - snyk/actions/php
      - snyk/actions/dotnet
      - snyk/actions/gradle*
      - snyk/actions/maven*
      - snyk/actions/scala
      - snyk/actions/sbt*
      - snyk/actions/cocoapods
      - snyk/actions/elixir*
    commands: [snyk test]
    softInputs:
      command: [monitor]
  - id: snyk-code
    categories: [sast]
    commands: [snyk code test]
  - id: snyk-container
    categories: [image-scan]
    actions: [snyk/actions/docker]
    commands: [snyk container test]
    softInputs:
      command: [monitor, container monitor]
  - id: snyk-iac
    categories: [iac]
    actions: [snyk/actions/iac]
    commands: [snyk iac test]
  # https://github.com/google/osv-scanner/blob/main/docs/output.md ("non-zero exit code (1) if any vulnerabilities are found")
  - id: osv-scanner
    categories: [deps]
    actions: [google/osv-scanner-action, google/osv-scanner-action/osv-scanner-action]
    commands: [osv-scanner]
  # npm audit signatures checks registry signatures, not vulnerabilities
  # --audit-level=none: https://github.com/npm/cli/blob/latest/lib/utils/reify-output.js uses 'none' as the level
  # for commands that must not fail on an audit
  - id: npm-audit
    categories: [deps]
    commands: [npm audit, pnpm audit, yarn audit]
    excludes: [npm audit signatures]
    softFlags: [--audit-level=none]
  # Action: https://github.com/pypa/gh-action-pip-audit/blob/main/action.py (exits 0 when
  # internal-be-careful-allow-failure is anything but "false")
  - id: pip-audit
    categories: [deps]
    actions: [pypa/gh-action-pip-audit]
    commands: [pip-audit]
    softUnless:
      internal-be-careful-allow-failure: ['false']
  # https://github.com/actions/dependency-review-action/blob/main/README.md (fail-on-severity default low; warn-only)
  - id: dependency-review
    categories: [deps]
    actions: [actions/dependency-review-action]
    softInputs:
      warn-only: ['true']
  # CLI: https://github.com/golang/vuln/blob/master/cmd/govulncheck/doc.go ("Exit codes": exits 0 with -json,
  # -format sarif or -format openvex, whatever it finds)
  # Action: https://github.com/golang/govulncheck-action/blob/master/action.yml (output-format goes to -format)
  - id: govulncheck
    categories: [deps]
    actions: [golang/govulncheck-action]
    commands: [govulncheck]
    softFlags: [-json, --json, -format=json, -format=sarif, -format=openvex, --format=json, --format=sarif, --format=openvex]
    softInputs:
      output-format: [json, sarif, openvex]
  # ---------- containers and infrastructure ----------
  # CLI: https://github.com/aquasecurity/trivy/blob/main/docs/guide/configuration/others.md ("By default, Trivy exits
  # with code 0 even when security issues are detected")
  # Action: https://github.com/aquasecurity/trivy-action/blob/master/action.yaml (exit-code has no default and is
  # passed on only when non-empty: set_env_var_if_provided "TRIVY_EXIT_CODE")
  - id: trivy
    categories: [deps, image-scan, iac]
    actions: [aquasecurity/trivy-action]
    commands: [trivy]
    excludes: [trivy version]
    commandFails: flag
    failFlags: [--exit-code]
    softFlags: [--exit-code=0]
    actionFails: input
    failInputs:
      exit-code: ['*']
    softInputs:
      exit-code: ['0']
  # CLI: https://github.com/anchore/grype/blob/main/cmd/grype/cli/options/grype.go (--fail-on / -f, empty by default)
  # Action: https://github.com/anchore/scan-action/blob/main/action.yml (fail-build default "true") and its bundled
  # code (`failBuild = failBuild.toLowerCase() === "true"`, an empty value means "true"): anything else is soft
  - id: grype
    categories: [deps, image-scan]
    actions: [anchore/scan-action]
    commands: [grype]
    excludes: [grype version]
    commandFails: flag
    failFlags: [--fail-on, -f]
    softUnless:
      fail-build: ['true']
  - id: docker-build
    categories: [image-build]
    actions: [docker/build-push-action]
    commands: [docker build, docker buildx build]
  # CLI: https://github.com/bridgecrewio/checkov/blob/main/docs/2.Basics/CLI%20Command%20Reference.md (-s, --soft-fail)
  # Action: https://github.com/bridgecrewio/checkov/blob/main/github_action_resources/entrypoint.sh (adds --soft-fail
  # only when soft_fail is "true")
  - id: checkov
    categories: [iac]
    actions: [bridgecrewio/checkov-action]
    commands: [checkov]
    softFlags: [--soft-fail, -s]
    softInputs:
      soft_fail: ['true']
  # CLI: https://github.com/aquasecurity/tfsec/blob/master/internal/app/tfsec/cmd/flags.go (--soft-fail, -s)
  # Action: https://github.com/aquasecurity/tfsec-action/blob/master/entrypoint.sh (`if [ -n "${INPUT_SOFT_FAIL}" ]`:
  # any non-empty soft_fail, even "false", adds --soft-fail)
  - id: tfsec
    categories: [iac]
    actions: [aquasecurity/tfsec-action]
    commands: [tfsec]
    softFlags: [--soft-fail, -s]
    softInputs:
      soft_fail: ['*']
  # ---------- running app (DAST) ----------
  # https://github.com/zaproxy/action-baseline/blob/master/action.yml (fail_action default false; same in
  # action-full-scan and action-api-scan)
  - id: zap
    categories: [dast]
    actions: [zaproxy/action-baseline, zaproxy/action-full-scan, zaproxy/action-api-scan]
    commands: [zap-baseline.py, zap-full-scan.py, zap-api-scan.py]
    actionFails: input
    failInputs:
      fail_action: ['true']
  # ---------- tests ----------
  - id: jest
    categories: [unit-tests, full-tests]
    commands: [jest]
  - id: vitest
    categories: [unit-tests, full-tests]
    commands: [vitest]
  - id: mocha
    categories: [unit-tests, full-tests]
    commands: [mocha]
  - id: go-test
    categories: [unit-tests, full-tests]
    commands: [go test]
  # ---------- lint and format ----------
  # hook: https://github.com/pre-commit/mirrors-eslint/blob/main/.pre-commit-hooks.yaml (id eslint, entry eslint)
  - id: eslint
    categories: [lint, format-lint]
    commands: [eslint]
    precommitHooks:
      - repo: https://github.com/pre-commit/mirrors-eslint
        ids: [eslint]
  # hooks: https://github.com/biomejs/pre-commit/blob/main/.pre-commit-hooks.yaml (biome ci / check / format / lint)
  - id: biome
    categories: [lint, format-lint]
    commands: [biome]
    precommitHooks:
      - repo: https://github.com/biomejs/pre-commit
        ids: [biome-ci, biome-check, biome-format, biome-lint]
  # https://github.com/astral-sh/ruff/blob/main/docs/linter.md (--exit-zero)
  # hooks: https://github.com/astral-sh/ruff-pre-commit/blob/main/.pre-commit-hooks.yaml (ruff-check and the legacy
  # alias ruff: `ruff check --force-exclude`; ruff-format: `ruff format --force-exclude`)
  - id: ruff
    categories: [lint, format-lint]
    actions: [astral-sh/ruff-action]
    commands: [ruff]
    softFlags: [--exit-zero]
    precommitHooks:
      - repo: https://github.com/astral-sh/ruff-pre-commit
        ids: [ruff, ruff-check, ruff-format]
  # https://github.com/PyCQA/flake8/blob/main/src/flake8/main/options.py (--exit-zero)
  # hook: https://github.com/PyCQA/flake8/blob/main/.pre-commit-hooks.yaml (id flake8, entry flake8)
  - id: flake8
    categories: [lint, format-lint]
    commands: [flake8]
    softFlags: [--exit-zero]
    precommitHooks:
      - repo: https://github.com/PyCQA/flake8
        ids: [flake8]
  # https://github.com/pylint-dev/pylint/blob/main/pylint/lint/run.py (exit_zero)
  - id: pylint
    categories: [lint]
    commands: [pylint]
    softFlags: [--exit-zero]
  # https://github.com/golangci/golangci-lint/blob/main/pkg/commands/flagsets.go (issues-exit-code)
  - id: golangci-lint
    categories: [lint, format-lint]
    actions: [golangci/golangci-lint-action]
    commands: [golangci-lint]
    softFlags: [--issues-exit-code=0]
  - id: prettier
    categories: [format-lint]
    commands: [prettier]
  # hooks: https://github.com/psf/black-pre-commit-mirror/blob/main/.pre-commit-hooks.yaml (black, black-jupyter: entry black)
  - id: black
    categories: [format-lint]
    commands: [black]
    precommitHooks:
      - repo: https://github.com/psf/black-pre-commit-mirror
        ids: [black, black-jupyter]
  - id: lint-staged
    categories: [format-lint]
    commands: [lint-staged]
  # ---------- git hooks run in CI ----------
  - id: pre-commit
    categories: [hooks-ci]
    actions: [pre-commit/action]
    commands: [pre-commit run]
  - id: lefthook
    categories: [hooks-ci]
    commands: [lefthook run]
  - id: husky-hooks
    categories: [hooks-ci]
    commands: [.husky/pre-commit]
  # ---------- deploy: SBOM, signing, attestation ----------
  # anchore/sbom-action only (never anchore/sbom-action/download-syft, which only downloads syft)
  - id: syft
    categories: [sbom]
    actions: [anchore/sbom-action]
    commands: [syft]
    excludes: [syft version]
  - id: cosign
    categories: [signing]
    commands: [cosign sign, cosign sign-blob]
  - id: attest-build-provenance
    categories: [attestation]
    actions: [actions/attest-build-provenance, actions/attest, actions/attest-sbom]
  # npm provenance: https://docs.npmjs.com/generating-provenance-statements ("Add the --provenance flag to your publish
  # command"; the job needs id-token: write, or the publish fails). npm reads `--provenance false` as off, and a dry
  # run publishes nothing. Trusted publishing also adds provenance without the flag
  # (https://docs.npmjs.com/trusted-publishers), but that is set on npmjs.com, not in the repo, so it isn't counted.
  - id: npm-provenance
    categories: [attestation]
    commands: [npm publish]
    onlyWithFlags: [--provenance, --provenance=true]
    notWithFlags: [--provenance=false, --no-provenance, --dry-run]
  # https://github.com/pypa/gh-action-pypi-publish/blob/unstable/v1/action.yml (attestations: default 'true', "Only
  # works with PyPI and TestPyPI via Trusted Publishing"); the README: attestations are "limited to Trusted Publishing
  # flows using PyPI or TestPyPI". A password (an API token) means no trusted publishing, so no attestation.
  - id: pypi-publish
    categories: [attestation]
    actions: [pypa/gh-action-pypi-publish]
    skipInputs:
      password: ['*']
    skipUnless:
      attestations: ['true']
      repository-url: ['https://upload.pypi.org/legacy/', 'https://test.pypi.org/legacy/']
      repository_url: ['https://upload.pypi.org/legacy/', 'https://test.pypi.org/legacy/']
